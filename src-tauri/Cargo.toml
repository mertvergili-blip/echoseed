[package]
name = "echoseed"
version = "0.1.0"
description = "ECHOSEED — artificial ecosystem terrarium with an ascended desktop creature"
authors = ["ECHOSEED"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "echoseed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
