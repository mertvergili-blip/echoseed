<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#EFEDF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BEYİN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#F4F3F6; --sky2:#E9E5EF;
    --ground:#C0B5CF; --ground-hi:#CDC3DA;
    --outline:#1A1520;
    --ink:#211C28; --muted:#7B7386;
    --card:#FFFFFF; --tile:rgba(26,21,32,.07);
    --green:#3FC978; --amber:#F0A63C; --red:#E2523F;
    --crimson:#D8352B;
    --ui:"Poppins",-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
    --num:"Baloo 2","Poppins",-apple-system,sans-serif;
    --r-lg:30px; --r-md:22px; --r-sm:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ui);
    background:var(--sky1);
    color:var(--ink);
    font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  .app{
    max-width:460px;margin:0 auto;
    padding-block:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-bottom) + 22px);
    padding-left:calc(env(safe-area-inset-left) + 16px);
    padding-right:calc(env(safe-area-inset-right) + 16px);
  }

  /* çıkartma rakam: SVG paint-order ile temiz kalın kontur */
  #hpsvg{display:block;width:100%;max-width:250px;margin:0 auto}
  #hpsvg text{font-family:var(--num);font-weight:800}

  /* ---------- üst çubuk ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
  .wordmark{font-weight:800;letter-spacing:.16em;font-size:15px}
  .streak{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px}
  .streak em{font-style:normal;font-size:19px;line-height:1}

  /* ---------- sahne ---------- */
  .hero{
    position:relative;border-radius:var(--r-lg);overflow:hidden;
    background:linear-gradient(180deg,var(--sky1),var(--sky2));
    border:2.5px solid var(--outline);
    box-shadow:0 8px 0 rgba(26,21,32,.12);
  }
  .ground{
    position:absolute;left:-12%;right:-12%;bottom:0;height:52%;
    background:linear-gradient(180deg,var(--ground-hi),var(--ground));
    border-radius:52% 52% 0 0 / 26% 26% 0 0;
    border-top:2.5px solid var(--outline);
  }
  .stage{position:relative;padding:22px 0 6px;display:flex;justify-content:center}
  #brainWrap{width:min(56vw,208px);transform-origin:50% 92%;position:relative}
  #brainWrap.sway{animation:sway 2.4s ease-in-out infinite}
  #brainWrap.breathe{animation:bob 3.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .drip{animation:drip 2.2s linear infinite}
  @keyframes drip{0%{opacity:0;transform:translateY(0)}14%{opacity:1}100%{opacity:0;transform:translateY(44px)}}
  .fly{animation:orbit 3.4s linear infinite;transform-origin:150px 125px}
  @keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  #healFlash{
    position:absolute;inset:-6%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 66%);
    opacity:0;pointer-events:none;
  }
  #healFlash.on{animation:heal 1100ms ease-out}
  @keyframes heal{0%{opacity:0;transform:scale(.55)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}

  .readout{position:relative;text-align:center;padding:0 18px 20px}
  #hp{font-size:74px;line-height:.98;letter-spacing:-.01em}
  #hp small{font-size:.44em;margin-left:2px}
  #tag{
    display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;
    background:rgba(255,255,255,.9);border:2.5px solid var(--outline);
    font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  }
  .bar{
    height:16px;border-radius:999px;background:rgba(255,255,255,.75);
    border:2.5px solid var(--outline);margin-top:14px;overflow:hidden;
  }
  .bar i{display:block;height:100%;background:var(--green);transition:width .7s cubic-bezier(.2,.8,.2,1),background .5s}

  /* ---------- istatistik karoları ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
  .stats div{
    background:var(--card);border:2.5px solid var(--outline);border-radius:var(--r-sm);
    box-shadow:0 4px 0 rgba(26,21,32,.12);
    padding:11px 3px 9px;text-align:center;
  }
  .stats i{display:block;font-style:normal;font-size:17px;line-height:1;margin-bottom:5px}
  .stats b{display:block;font-family:var(--num);font-weight:800;font-size:21px;line-height:1}
  .stats span{display:block;margin-top:2px;font-size:9.5px;font-weight:600;color:var(--muted)}

  /* ---------- acı gerçek ---------- */
  .fact{
    background:var(--card);border:2.5px solid var(--outline);border-radius:var(--r-md);
    box-shadow:0 6px 0 rgba(26,21,32,.12);
    margin-top:14px;padding:18px 16px 20px;text-align:center;
  }
  .fact .kicker{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:#FFF;background:var(--crimson);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;
  }
  .fact .big{
    font-family:var(--num);font-weight:800;color:var(--crimson);
    font-size:clamp(50px,15vw,72px);line-height:1;letter-spacing:-.02em;
    display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap;
  }
  .fact .unit{font-family:var(--ui);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
  .fact p{margin:10px 2px 0;font-size:15px;font-weight:500;color:#544C5E;line-height:1.45}
  .fact.swap{animation:swap 460ms cubic-bezier(.2,.8,.2,1)}
  @keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- düğmeler ---------- */
  .acts{display:grid;gap:11px;margin-top:16px}
  button{
    font-family:var(--ui);font-weight:700;font-size:17px;
    border:2.5px solid var(--outline);border-radius:999px;padding:16px 18px;width:100%;
    cursor:pointer;transition:transform .1s ease,box-shadow .1s ease,opacity .2s ease;
  }
  #quit{background:var(--green);color:var(--outline);box-shadow:0 6px 0 rgba(26,21,32,.85)}
  #quit:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(26,21,32,.85)}
  #enter{
    background:transparent;color:var(--muted);border-color:rgba(26,21,32,.28);
    border-style:dashed;font-size:15px;font-weight:600;
  }
  #enter[disabled]{opacity:.7;cursor:not-allowed}
  #enter:not([disabled]){border-style:solid;color:var(--ink)}
  #enter .cd{color:var(--crimson);font-weight:800;font-family:var(--num)}

  /* ---------- görev ---------- */
  .task{
    margin-top:12px;border-radius:var(--r-md);padding:17px 18px;display:none;
    background:#E4F7EC;border:2.5px solid var(--outline);box-shadow:0 5px 0 rgba(26,21,32,.12);
  }
  .task.on{display:block;animation:swap 460ms cubic-bezier(.2,.8,.2,1)}
  .task h3{margin:0 0 5px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#1E7A4A}
  .task p{margin:0;font-size:18px;font-weight:700;line-height:1.35}

  /* ---------- ayarlar ---------- */
  details{
    margin-top:14px;background:var(--card);border:2.5px solid var(--outline);
    border-radius:var(--r-md);box-shadow:0 5px 0 rgba(26,21,32,.12);padding:15px 17px;
  }
  summary{
    font-size:14px;font-weight:700;cursor:pointer;list-style:none;
    display:flex;align-items:center;justify-content:space-between;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"›";font-size:22px;font-weight:700;transform:rotate(90deg)}
  details[open] summary::after{transform:rotate(-90deg)}
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 0;border-bottom:2px solid rgba(26,21,32,.08);
  }
  .row:first-of-type{margin-top:8px}
  .row label{font-size:14.5px;font-weight:500}
  .row input{
    font-family:var(--num);font-weight:800;font-size:19px;color:var(--ink);
    width:84px;text-align:center;background:#F1EEF6;
    border:2.5px solid var(--outline);border-radius:12px;padding:7px 6px;
  }
  #reset{
    margin-top:14px;background:#FCE9E7;color:var(--crimson);
    font-size:14px;font-weight:700;padding:13px;box-shadow:0 4px 0 rgba(26,21,32,.5);
  }
  #reset:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(26,21,32,.5)}
  footer{text-align:center;margin-top:18px;font-size:11px;font-weight:600;color:var(--muted)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="wordmark">BEYİN</div>
    <div class="streak"><span>🔥</span><em id="streakNum">0</em></div>
  </div>

  <section class="hero">
    <div class="ground"></div>

    <div class="stage">
      <div id="brainWrap">
        <svg id="brain" viewBox="0 0 300 300" width="100%" role="img" aria-label="Beyin karakteri">
          <defs><clipPath id="brainClip"></clipPath></defs>
          <ellipse id="shadow" cx="150" cy="272" rx="62" ry="9" fill="#1A1520" opacity=".18"></ellipse>
          <g id="legs"></g>
          <g id="lobeOutline"></g>
          <g id="lobeFill"></g>
          <g clip-path="url(#brainClip)">
            <g id="gyri"></g>
            <g id="spots"></g>
          </g>
          <g id="face"></g>
          <g id="drips"></g>
          <g id="flies"></g>
        </svg>
        <div id="healFlash"></div>
      </div>
    </div>

    <div class="readout">
      <svg id="hpsvg" viewBox="0 0 250 96" aria-label="Beyin sağlığı">
        <text x="125" y="74" text-anchor="middle" font-size="74"
              fill="var(--outline)" stroke="var(--outline)" stroke-width="11"
              stroke-linejoin="round" paint-order="stroke" transform="translate(0,7)"
        ><tspan id="hpBack">60</tspan><tspan font-size="34">%</tspan></text>
        <text x="125" y="74" text-anchor="middle" font-size="74"
              fill="#FFFFFF" stroke="var(--outline)" stroke-width="11"
              stroke-linejoin="round" paint-order="stroke"
        ><tspan id="hpNum">60</tspan><tspan font-size="34">%</tspan></text>
      </svg>
      <div><span id="tag">TAZE</span></div>
      <div class="bar"><i id="bar" style="width:60%"></i></div>
    </div>
  </section>

  <div class="stats">
    <div><i>👀</i><b id="sVisits">0</b><span>Geliş</span></div>
    <div><i>📲</i><b id="sEnters">0</b><span>Giriş</span></div>
    <div><i>✋</i><b id="sQuits">0</b><span>Vazgeçiş</span></div>
    <div><i>🏆</i><b id="sTotal">0</b><span>Toplam</span></div>
  </div>

  <div class="fact" id="fact">
    <span class="kicker">Acı gerçek</span>
    <div class="big"><span id="factBig">—</span><span class="unit" id="factUnit"></span></div>
    <p id="factText">…</p>
  </div>

  <div class="acts">
    <button id="quit">Vazgeçtim</button>
    <button id="enter" disabled>Yine de gir <span class="cd" id="cd"></span></button>
  </div>

  <div class="task" id="task">
    <h3>Telefon yerine</h3>
    <p id="taskText"></p>
  </div>

  <details>
    <summary>Ayarlar</summary>
    <div class="row"><label for="age">Yaş</label><input id="age" type="number" inputmode="numeric" min="10" max="79" step="1"></div>
    <div class="row"><label for="hours">Günlük ekran saati</label><input id="hours" type="number" inputmode="decimal" min="0.5" max="16" step="0.5"></div>
    <button id="reset">Her şeyi sıfırla</button>
  </details>

  <footer>Beyin · v1</footer>
</div>

<script>
(function(){
  "use strict";

  var KEY = "beyin_v1";
  var SHORTCUT = "shortcuts://run-shortcut?name=InstaGec";

  /* ============================================================
     AYARLANABİLİR SABİTLER
     ============================================================ */
  var START_HEALTH   = 60;
  var COST_VISIT     = -3;
  var COST_ENTER     = -7;
  var GAIN_QUIT      = 8;
  var GAIN_NEW_DAY   = 5;
  var REFRESH_MS     = 60000;
  var LOCK_BASE      = 10;
  var LOCK_PER_ENTER = 5;
  var LOCK_MAX       = 60;

  /* ============================================================
     ACI GERÇEKLER — yeni gerçek eklemek için diziye bir fonksiyon ekle.
     c = {age, hours, visits, enters, quits, totalQuits}
     Döner: {big, unit, text}
     ============================================================ */
  var GERCEKLER = [
    function(c){
      var y = (80 - c.age) * c.hours / 24;
      return {big: y.toFixed(1), unit:"yıl",
        text:"80 yaşına kadar bu tempoyla ekrana gidecek net ömür. Uyku değil, ekran."};
    },
    function(c){
      return {big: Math.round(c.hours / 16 * 100), unit:"%",
        text:"Uyanık geçirdiğin günün bu kadarı Reels. Geri kalanı her şey."};
    },
    function(c){
      var h = Math.max(0, (26 - c.age)) * 365 * c.hours;
      return {big: Math.round(h).toLocaleString("tr-TR"), unit:"saat",
        text:"26 yaşına kadar bu tempoyla ekranda geçecek toplam saat."};
    },
    function(c){
      var h = Math.max(0, (26 - c.age)) * 365 * c.hours;
      return {big: (h / 2000).toFixed(1), unit:"yıl mesai",
        text:"26 yaşına kadarki o saatler, yılda 2000 saatlik tam zamanlı bir işin kaç yılı eder."};
    },
    function(c){
      return {big: (c.hours * 365 / 2000).toFixed(1), unit:"yıl mesai",
        text:"Sadece bu yıl. Tam zamanlı çalışan biri bu kadar sürede bir kariyer basamağı çıkıyor."};
    },
    function(c){
      return {big: Math.round(c.hours * 7), unit:"saat / hafta",
        text:"Bir parçayı kalıptan prototipe çıkarmaya yeter. Her hafta. Yeniden."};
    },
    function(c){
      return {big: c.visits, unit:"kez",
        text:"Bugün bu sayfayı bu kadar kez gördün. Refleks, karar değil."};
    },
    function(c){
      return {big: Math.round((80 - c.age) * c.hours / 24 * 12), unit:"ay",
        text:"Aynı ömür, ay cinsinden. Ay olarak duymak daha yakın geliyor."};
    },
    function(c){
      var h = Math.max(0, (26 - c.age)) * 365 * c.hours;
      return {big: Math.round(h / 40), unit:"koleksiyon",
        text:"Bir kapsül koleksiyonu 40 saat sürüyor diyelim. 26 yaşına kadarki ekran saatin bu kadar koleksiyon eder."};
    },
    function(c){
      return {big: Math.round(c.hours * 60), unit:"dakika",
        text:"Bugünün bütçesi. Creative director olan kimse bunu bir başkasının kurgusunu izleyerek harcamadı."};
    },
    function(c){
      var y = Math.max(0, 26 - c.age);
      return {big: y, unit:"yıl kaldı",
        text:"Finansal bağımsızlık ve kendi markan için verdiğin süre. Gün sayısı: " +
             Math.round(y * 365).toLocaleString("tr-TR") + "."};
    },
    function(c){
      return {big: c.totalQuits, unit:"vazgeçiş",
        text:"Şimdiye kadar geri döndüğün an sayısı. Kanıt burada duruyor."};
    }
  ];

  var GOREVLER = [
    "Bir eskiz çiz. Kötü olsun, olsun.",
    "20 squat. Şimdi.",
    "Telefonu başka bir odaya bırak.",
    "Bir bardak su iç.",
    "Pencereyi aç, 10 kez derin nefes.",
    "Bir dikiş payı ölç, bir parça kes.",
    "Aklındaki fikri tek cümleyle yaz.",
    "Odandaki bir yüzeyi topla.",
    "2 dakika gözlerini kapat, hiçbir şey yapma.",
    "Bir referans görselini kaydet, neden sevdiğini yaz.",
    "Ayakta esne, omuzlarını aç.",
    "Birine bir cümlelik mesaj at — gerçek biri."
  ];

  /* ============================================================
     DURUM
     ============================================================ */
  function today(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  var defaults = {
    health: START_HEALTH, lastTs: 0, day: "",
    visits: 0, enters: 0, quits: 0,
    totalQuits: 0, totalEnters: 0,
    streak: 0,
    age: 24, hours: 8, bag: []
  };

  var S;
  function load(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    S = Object.assign({}, defaults);
    if (raw){
      try {
        var p = JSON.parse(raw);
        for (var k in defaults) if (p[k] !== undefined && p[k] !== null) S[k] = p[k];
      } catch(e){}
    }
    S.health = clamp(Number(S.health) || 0, 0, 100);
    S.age    = clamp(Number(S.age)   || defaults.age, 10, 79);
    S.hours  = clamp(Number(S.hours) || defaults.hours, 0.5, 16);
    if (!Array.isArray(S.bag)) S.bag = [];
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  }

  function registerVisit(){
    var now = Date.now(), d = today();
    if (S.day !== d){
      if (S.day !== ""){
        S.health = clamp(S.health + GAIN_NEW_DAY, 0, 100);
        S.streak = (S.enters === 0) ? (S.streak + 1) : 0;   // dün hiç girmediysen seri büyür
      }
      S.day = d; S.visits = 0; S.enters = 0; S.quits = 0;
    }
    if (now - (S.lastTs || 0) > REFRESH_MS){
      S.visits += 1;
      S.health = clamp(S.health + COST_VISIT, 0, 100);
      S.lastTs = now;
    }
    save();
  }

  /* ============================================================
     BEYİN — düz vektör, kalın kontur
     ============================================================ */
  var el = function(id){ return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";
  var OUT = "#1A1520", SW = 6;
  var CX = 150, CY = 125;

  function rnd(seed){
    var x = Math.sin(seed * 127.1) * 43758.5453;
    return x - Math.floor(x);
  }

  /* lob daireleri — birleşimleri silüeti verir */
  var LOBES = (function(){
    var L = [{cx:CX, cy:CY, rx:90, ry:72}];
    [{a:-78,r:33},{a:-46,r:32},{a:-14,r:31},{a:18,r:30},{a:50,r:27},{a:80,r:23}].forEach(function(o){
      var t = o.a * Math.PI / 180;
      var x = CX + 76 * Math.cos(t), y = CY + 58 * Math.sin(t);
      L.push({cx:x, cy:y, rx:o.r, ry:o.r * 0.92});
      L.push({cx:CX - (x - CX), cy:y, rx:o.r, ry:o.r * 0.92});
    });
    L.push({cx:CX, cy:CY - 64, rx:29, ry:25});
    return L;
  })();

  /* kıvrımlar — tek renk ince çizgi, düz stil */
  var FISSURE = "M150 40 C 145 62, 154 82, 150 104";
  var GYRI_L = [
    "M138 48 C 112 52, 98 66, 104 90",
    "M110 32 C 98 48, 78 52, 66 68",
    "M58 92 C 82 94, 96 104, 94 122",
    "M52 138 C 74 140, 86 150, 88 166",
    "M128 62 C 110 66, 100 78, 104 94"
  ];

  /* lekeler yüz bölgesine düşmesin: gözler ve ağız açıkta kalsın */
  var SPOTS = [];
  for (var i = 0, seed = 0; SPOTS.length < 16 && seed < 400; seed++){
    var ang = rnd(seed + 2.7) * Math.PI * 2;
    var rad = 0.30 + rnd(seed + 5.9) * 0.62;
    var x = CX + Math.cos(ang) * 100 * rad;
    var y = CY + Math.sin(ang) * 82 * rad;
    var dx = (x - CX) / 66, dy = (y - 152) / 46;
    if (dx*dx + dy*dy < 1) continue;               // yüz elipsi
    SPOTS.push({x:x, y:y, r: 8 + rnd(seed + 11.3) * 11, s: rnd(seed + 17.1)});
    i++;
  }

  function mix(a,b,t){
    return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)];
  }
  function rgb(c){ return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  function shade(c,t){ return t < 0 ? rgb(mix(c,[26,21,32],-t)) : rgb(mix(c,[255,250,246],t)); }

  var C_FRESH = [244,183,157];   // şeftali
  var C_MID   = [150,152,126];   // gri-yeşil
  var C_DEAD  = [ 86, 60, 44];   // koyu kahve

  function bodyRGB(h){
    if (h >= 45) return mix(C_MID, C_FRESH, Math.pow((h - 45) / 55, 0.62));
    return mix(C_DEAD, C_MID, Math.pow(h / 45, 1.15));
  }
  function tagFor(h){
    if (h >= 78) return "TAZE";
    if (h >= 55) return "YORGUN";
    if (h >= 35) return "BULANIK";
    if (h >= 15) return "ÇÜRÜYOR";
    return "ZOMBİ";
  }
  function barColor(h){
    return h >= 60 ? "var(--green)" : h >= 30 ? "var(--amber)" : "var(--red)";
  }

  function mk(name, attrs){
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function drawBrain(h){
    var base = bodyRGB(h);
    var fold = shade(base, -0.4);

    /* --- bacaklar (gövdenin arkasında) --- */
    var lg = el("legs"); clear(lg);
    var legDrop = h < 35 ? 4 : 0;
    [[128, -1], [172, 1]].forEach(function(p){
      var x = p[0], dir = p[1];
      lg.appendChild(mk("path", {
        d:"M" + x + " 186 C " + x + " 214, " + (x + dir*4) + " 226, " + (x + dir*6) + " " + (238 + legDrop),
        fill:"none", stroke:OUT, "stroke-width":"9", "stroke-linecap":"round"
      }));
      lg.appendChild(mk("ellipse", {
        cx:(x + dir*13), cy:(242 + legDrop), rx:"14", ry:"8", fill:OUT
      }));
    });

    /* --- silüet: aynı küme kontur + dolgu + kırpma --- */
    var outline = el("lobeOutline"), fillG = el("lobeFill"), clipG = el("brainClip");
    clear(outline); clear(fillG); clear(clipG);
    LOBES.forEach(function(o){
      var a = {cx:o.cx.toFixed(1), cy:o.cy.toFixed(1), rx:o.rx, ry:o.ry};
      outline.appendChild(mk("ellipse", Object.assign({}, a,
        {fill:OUT, stroke:OUT, "stroke-width":SW, "stroke-linejoin":"round"})));
      fillG.appendChild(mk("ellipse", Object.assign({}, a, {fill:rgb(base)})));
      clipG.appendChild(mk("ellipse", a));
    });

    /* --- kıvrımlar --- */
    var g = el("gyri"); clear(g);
    function fold_(parent, d, w){
      parent.appendChild(mk("path", {d:d, fill:"none", stroke:fold,
        "stroke-width":w, "stroke-linecap":"round", "stroke-linejoin":"round"}));
    }
    fold_(g, FISSURE, 7);
    var mirror = mk("g", {transform:"translate(300,0) scale(-1,1)"});
    g.appendChild(mirror);
    GYRI_L.forEach(function(d){ fold_(g, d, 6.5); fold_(mirror, d, 6.5); });

    /* --- çürük lekeleri: düz, konturlu --- */
    var sp = el("spots"); clear(sp);
    var count = Math.max(0, Math.round((78 - h) / 78 * SPOTS.length));  // 78 üstü tertemiz
    for (var i = 0; i < count; i++){
      var s = SPOTS[i];
      var blob = mk("g", {opacity:(0.55 + (1 - h/100) * 0.45).toFixed(2)});
      for (var k = 0; k < 3; k++){
        var o = (k - 1) * s.r * 0.62;
        blob.appendChild(mk("ellipse", {
          cx:(s.x + o * (0.6 + s.s)).toFixed(1),
          cy:(s.y + o * (s.s - 0.5)).toFixed(1),
          rx:(s.r * (0.66 + k * 0.14)).toFixed(1),
          ry:(s.r * (0.54 + k * 0.11)).toFixed(1),
          fill:"#4A3524"
        }));
      }
      blob.appendChild(mk("ellipse", {
        cx:s.x.toFixed(1), cy:s.y.toFixed(1),
        rx:(s.r * 0.4).toFixed(1), ry:(s.r * 0.32).toFixed(1), fill:"#241708"
      }));
      sp.appendChild(blob);
    }

    /* --- yüz: sade, çizgi film --- */
    var f = el("face"); clear(f);
    var lum = 0.299*base[0] + 0.587*base[1] + 0.114*base[2];
    var INK = lum < 105 ? "#F6EFE6" : OUT;
    var EX = 36, EY = 134;
    var eyes = [CX - EX, CX + EX];

    if (h >= 55){
      /* yanak allığı */
      [CX - 56, CX + 56].forEach(function(x){
        f.appendChild(mk("ellipse", {cx:x, cy:EY + 20, rx:"12", ry:"7.5",
          fill:"#E2705E", opacity:((h - 55) / 45 * 0.4 + 0.18).toFixed(2)}));
      });
    }

    if (h < 15){                                   // ZOMBİ
      eyes.forEach(function(x){
        f.appendChild(mk("path", {
          d:"M"+(x-11)+" "+(EY-11)+" L"+(x+11)+" "+(EY+11)+" M"+(x+11)+" "+(EY-11)+" L"+(x-11)+" "+(EY+11),
          stroke:INK, "stroke-width":"7", "stroke-linecap":"round"
        }));
      });
      f.appendChild(mk("path", {d:"M118 180 q11 -11 22 0 q11 11 22 0 q11 -11 22 0",
        fill:"none", stroke:INK, "stroke-width":"5.5", "stroke-linecap":"round"}));
    } else if (h < 35){                            // ÇÜRÜYOR — yarı kapalı, düşük kapak
      eyes.forEach(function(x){
        f.appendChild(mk("path", {d:"M"+(x-10)+" "+EY+" a10 11 0 0 0 20 0 z", fill:INK}));
        f.appendChild(mk("path", {d:"M"+(x-12)+" "+(EY-1)+" L"+(x+12)+" "+(EY-1),
          fill:"none", stroke:INK, "stroke-width":"6", "stroke-linecap":"round"}));
      });
      f.appendChild(mk("path", {d:"M128 184 q22 -14 44 0",
        fill:"none", stroke:INK, "stroke-width":"5.5", "stroke-linecap":"round"}));
    } else if (h < 55){                            // BULANIK — yarı kapalı
      eyes.forEach(function(x){
        f.appendChild(mk("path", {d:"M"+(x-12)+" "+EY+" q12 10 24 0",
          fill:"none", stroke:INK, "stroke-width":"6.5", "stroke-linecap":"round"}));
      });
      f.appendChild(mk("path", {d:"M130 178 L170 178",
        fill:"none", stroke:INK, "stroke-width":"5.5", "stroke-linecap":"round"}));
    } else {                                       // YORGUN / TAZE
      eyes.forEach(function(x){
        f.appendChild(mk("ellipse", {cx:x, cy:EY, rx:"9.5", ry:"11", fill:INK}));
        f.appendChild(mk("circle", {cx:x - 3, cy:EY - 4, r:"3", fill:"#FFF"}));
      });
      f.appendChild(mk("path", {
        d: h >= 78 ? "M128 174 q22 20 44 0" : "M132 176 q18 12 36 0",
        fill:"none", stroke:INK, "stroke-width":"5.5", "stroke-linecap":"round"
      }));
    }

    /* --- damlalar --- */
    var dr = el("drips"); clear(dr);
    if (h < 50){
      var n = h < 25 ? 4 : h < 38 ? 3 : 2;
      for (var j = 0; j < n; j++){
        var side = (j % 2 === 0) ? -1 : 1;
        var dx = CX + side * (34 + rnd(j + 31) * 30);
        var dy = 184 + rnd(j + 41) * 10;
        var drop = mk("path", {
          d:"M" + dx + " " + dy + " c -7 11, -7 19, 0 19 c 7 0, 7 -8, 0 -19 z",
          fill: shade(base, -0.45), stroke:OUT, "stroke-width":"3.5", "stroke-linejoin":"round"
        });
        if (!reduced){
          drop.setAttribute("class", "drip");
          drop.style.animationDelay = (j * 0.55) + "s";
        }
        dr.appendChild(drop);
      }
    }

    /* --- sinekler --- */
    var fl = el("flies"); clear(fl);
    if (h < 30 && !reduced){
      for (var k2 = 0; k2 < 3; k2++){
        var gg = mk("g", {class:"fly"});
        gg.style.animationDelay = (k2 * 1.1) + "s";
        gg.style.animationDuration = (3.2 + k2 * 0.7) + "s";
        var fly = mk("g", {transform:"translate(" + (CX + 102 + k2 * 13) + "," + (CY - k2 * 18) + ")"});
        fly.appendChild(mk("ellipse", {cx:"-4", cy:"-3", rx:"4", ry:"2", fill:OUT, opacity:".45"}));
        fly.appendChild(mk("ellipse", {cx:"4",  cy:"-3", rx:"4", ry:"2", fill:OUT, opacity:".45"}));
        fly.appendChild(mk("ellipse", {cx:"0", cy:"0", rx:"4", ry:"2.8", fill:OUT}));
        gg.appendChild(fly);
        fl.appendChild(gg);
      }
    }

    el("brainWrap").className = reduced ? "" : (h < 40 ? "sway" : "breathe");
  }

  /* ============================================================
     GERÇEK SEÇİMİ (torba usulü rotasyon)
     ============================================================ */
  function ctx(){
    return {age:S.age, hours:S.hours, visits:S.visits,
            enters:S.enters, quits:S.quits, totalQuits:S.totalQuits};
  }
  function nextFact(){
    if (!S.bag.length){
      var idx = GERCEKLER.map(function(_, i){ return i; });
      for (var i = idx.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      }
      S.bag = idx;
    }
    S.bag = S.bag.filter(function(i){ return i < GERCEKLER.length; });
    var pick = S.bag.shift();
    if (pick === undefined) pick = 0;
    save();
    return GERCEKLER[pick](ctx());
  }
  function showFact(){
    var f = nextFact();
    el("factBig").textContent = f.big;
    el("factUnit").textContent = f.unit || "";
    el("factText").textContent = f.text;
    var box = el("fact");
    box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap");
  }

  /* ============================================================
     ARAYÜZ
     ============================================================ */
  function render(){
    var h = Math.round(S.health);
    el("hpNum").textContent = h;
    el("hpBack").textContent = h;
    el("tag").textContent = tagFor(h);
    el("bar").style.width = h + "%";
    el("bar").style.background = barColor(h);
    el("streakNum").textContent = S.streak;
    el("sVisits").textContent = S.visits;
    el("sEnters").textContent = S.enters;
    el("sQuits").textContent = S.quits;
    el("sTotal").textContent = S.totalQuits;
    el("age").value = S.age;
    el("hours").value = S.hours;
    drawBrain(h);
  }

  var lockTimer = null;
  function startLock(){
    var secs = Math.min(LOCK_BASE + LOCK_PER_ENTER * S.enters, LOCK_MAX);
    var btn = el("enter"), cd = el("cd");
    btn.disabled = true;
    clearInterval(lockTimer);
    cd.textContent = "· " + secs;
    lockTimer = setInterval(function(){
      secs -= 1;
      if (secs <= 0){ clearInterval(lockTimer); cd.textContent = ""; btn.disabled = false; }
      else { cd.textContent = "· " + secs; }
    }, 1000);
  }

  el("enter").addEventListener("click", function(){
    if (el("enter").disabled) return;
    S.enters += 1; S.totalEnters += 1;
    S.health = clamp(S.health + COST_ENTER, 0, 100);
    S.streak = 0;
    save(); render();
    window.location.href = SHORTCUT;
  });

  el("quit").addEventListener("click", function(){
    S.quits += 1; S.totalQuits += 1;
    S.health = clamp(S.health + GAIN_QUIT, 0, 100);
    save(); render();

    var flash = el("healFlash");
    flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");

    var t = el("task");
    el("taskText").textContent = GOREVLER[Math.floor(Math.random() * GOREVLER.length)];
    t.classList.add("on");
    t.scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"nearest"});
  });

  el("age").addEventListener("change", function(){
    S.age = clamp(parseFloat(this.value) || defaults.age, 10, 79);
    this.value = S.age; save(); showFact();
  });
  el("hours").addEventListener("change", function(){
    S.hours = clamp(parseFloat(this.value) || defaults.hours, 0.5, 16);
    this.value = S.hours; save(); showFact();
  });
  el("reset").addEventListener("click", function(){
    if (!confirm("Beyin sağlığı ve tüm istatistikler sıfırlanacak. Emin misin?")) return;
    try { localStorage.removeItem(KEY); } catch(e){}
    load(); S.day = today(); save(); render(); showFact();
  });

  load();
  registerVisit();
  render();
  showFact();
  startLock();
})();
</script>
</body>
</html>
